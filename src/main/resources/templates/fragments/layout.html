<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financeiro Pro | Gestão Inteligente</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Scripts & Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .sidebar-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-item:hover { transform: translateX(5px); }
        .gradient-primary { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>

    <script th:inline="javascript">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#7c3aed',
                        accent: '#10b981',
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>
<body class="flex min-h-screen">

    <aside th:fragment="sidebar" class="w-72 bg-dark text-white flex flex-col fixed h-full z-50">
        <div class="p-8">
            <div class="flex items-center gap-3 mb-10">
                <div class="w-10 h-10 gradient-primary rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <i class="fas fa-chart-line text-xl"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Financeiro<span class="text-indigo-400">PRO</span></span>
            </div>

            <nav class="space-y-2">
                <a th:href="@{/dashboard}" class="sidebar-item flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition group text-gray-400">
                    <i class="fas fa-th-large w-5 group-hover:text-indigo-400"></i>
                    <span>Dashboard</span>
                </a>
                <a th:href="@{/importar}" class="sidebar-item flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition group text-gray-400">
                    <i class="fas fa-file-upload w-5 group-hover:text-indigo-400"></i>
                    <span>Importar Dados</span>
                </a>
                <a th:href="@{/categorias}" class="sidebar-item flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition group text-gray-400">
                    <i class="fas fa-tags w-5 group-hover:text-indigo-400"></i>
                    <span>Categorias</span>
                </a>
                <a th:href="@{/relatorios}" class="sidebar-item flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition group text-gray-400">
                    <i class="fas fa-file-invoice w-5 group-hover:text-indigo-400"></i>
                    <span>Relatórios</span>
                </a>
            </nav>
        </div>

        <div class="mt-auto p-6 border-t border-white/5">
            <div class="flex items-center gap-3 mb-6 px-2">
                <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center border border-indigo-500/30">
                    <i class="fas fa-user text-indigo-400"></i>
                </div>
                <div>
                    <p class="text-sm font-bold truncate">Usuário</p>
                    <p class="text-xs text-gray-500">Administrador</p>
                </div>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="w-full flex items-center justify-center gap-3 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white px-4 py-3 rounded-xl transition font-medium">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </form>
        </div>
    </aside>

</body>
</html>
