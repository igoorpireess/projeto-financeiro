<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body class="bg-[#f8fafc] flex">

    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="flex-1 ml-72">
        <header class="h-20 bg-white/70 backdrop-blur-md border-b border-gray-100 flex items-center justify-between px-10 sticky top-0 z-40">
            <h1 class="text-xl font-bold text-gray-800">Gestão de Categorias</h1>
            <button onclick="document.getElementById('form-card').scrollIntoView({behavior: 'smooth'})" 
                    class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-sm font-bold shadow-lg shadow-indigo-200 hover:scale-105 transition">
                <i class="fas fa-plus mr-2"></i> Nova Categoria
            </button>
        </header>

        <main class="p-10">
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-10">
                
                <!-- Form Card -->
                <div id="form-card" class="xl:col-span-1">
                    <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 p-8 sticky top-32">
                        <h2 class="text-xl font-bold text-gray-800 mb-8">Cadastrar Categoria</h2>
                        
                        <form th:action="@{/categorias}" th:object="${novaCategoria}" method="post" class="space-y-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Nome da Categoria</label>
                                <input type="text" th:field="*{nome}" required placeholder="Ex: Alimentação"
                                    class="w-full px-5 py-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Meta Mensal (R$)</label>
                                <input type="number" step="0.01" th:field="*{metaMensal}" placeholder="Ex: 500.00"
                                    class="w-full px-5 py-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 uppercase mb-2 ml-1">Descrição Curta</label>
                                <textarea th:field="*{descricao}" rows="3" placeholder="Para que serve esta categoria?"
                                    class="w-full px-5 py-4 bg-gray-50 border-0 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition"></textarea>
                            </div>
                            <button type="submit" class="w-full gradient-primary text-white font-bold py-4 rounded-2xl shadow-xl shadow-indigo-200 hover:scale-[1.02] transition active:scale-95">
                                Salvar Categoria
                            </button>
                        </form>
                    </div>
                </div>

                <!-- List Card -->
                <div class="xl:col-span-2">
                    <div class="bg-white rounded-[2.5rem] shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-8 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                            <div>
                                <h2 class="text-xl font-bold text-gray-800">Categorias Ativas</h2>
                                <p class="text-sm text-gray-400">Gerencie seus limites e classificações</p>
                            </div>
                            <span class="bg-white text-indigo-600 px-4 py-2 rounded-xl text-xs font-bold shadow-sm border border-gray-100" th:text="${categorias.size()} + ' total'">0 total</span>
                        </div>
                        
                        <div th:if="${success}" class="m-8 p-4 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center gap-3 border border-emerald-100">
                            <i class="fas fa-check-circle"></i>
                            <span class="text-sm font-bold" th:text="${success}"></span>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-white text-gray-400 text-[10px] uppercase font-bold tracking-widest">
                                    <tr>
                                        <th class="px-8 py-5">Nome</th>
                                        <th class="px-8 py-5">Meta Mensal</th>
                                        <th class="px-8 py-5">Descrição</th>
                                        <th class="px-8 py-5 text-center">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-50">
                                    <tr th:each="cat : ${categorias}" class="hover:bg-gray-50/50 transition group">
                                        <td class="px-8 py-6">
                                            <div class="flex items-center gap-3">
                                                <div class="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-500 flex items-center justify-center text-xs">
                                                    <i class="fas fa-tag"></i>
                                                </div>
                                                <span class="font-bold text-gray-700" th:text="${cat.nome}">Alimentação</span>
                                            </div>
                                        </td>
                                        <td class="px-8 py-6">
                                            <span class="text-sm font-semibold text-emerald-600" th:text="'R$ ' + ${cat.metaMensal}">R$ 0,00</span>
                                        </td>
                                        <td class="px-8 py-6">
                                            <span class="text-sm text-gray-400 truncate block w-48" th:text="${cat.descricao != null ? cat.descricao : '-'}">-</span>
                                        </td>
                                        <td class="px-8 py-6 text-center">
                                            <div class="flex items-center justify-center gap-2 opacity-0 group-hover:opacity-100 transition">
                                                <button class="w-8 h-8 rounded-lg bg-gray-100 text-gray-500 hover:bg-indigo-600 hover:text-white transition">
                                                    <i class="fas fa-edit text-[10px]"></i>
                                                </button>
                                                <button class="w-8 h-8 rounded-lg bg-gray-100 text-red-500 hover:bg-red-500 hover:text-white transition">
                                                    <i class="fas fa-trash text-[10px]"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        
                        <div th:if="${categorias.empty}" class="p-20 text-center">
                            <div class="w-20 h-20 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i class="fas fa-folder-open text-3xl text-gray-200"></i>
                            </div>
                            <p class="text-gray-400 font-medium">Nenhuma categoria cadastrada ainda.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
